includes:
  - datasets.yaml

model:
  base_url: http://localhost:8000/v1
  name: null
  timeout_seconds: 300
  max_retries: 2
  max_tokens: 4096
  temperature: 0
  # Optional tokenizer/provider chat template. The serving backend applies its
  # BOS/EOS and role special tokens; lean-eval never renders these itself.
  chat_template: null
  extra_body: {}
  extra_headers: {}

axle:
  api_url: https://axle.axiommath.ai
  environment: null
  timeout_seconds: 900
  max_retries: 2

retry:
  backoff_seconds: 1

evaluation:
  concurrency: 4
  attempts: 1
  results_dir: results
  # Benchmark message/output contract, separate from model.chat_template.
  test_template: lean-cot-v1
  max_repair_rounds: 0
  repair_feedback_role: tool
