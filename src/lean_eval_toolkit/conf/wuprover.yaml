includes:
  - datasets.yaml

model:
  base_url: http://localhost:8321/v1
  name: Wuprover
  timeout_seconds: 3000
  max_retries: 2
  max_tokens: 8192
  temperature: 1.0
  # Passed to vLLM with every chat completion request. This controls switchable
  # Qwen3 templates; Qwen3-Coder-Next is already non-thinking and ignores it.
  extra_body:
    top_p: 0.95
    chat_template_kwargs:
      enable_thinking: false
  extra_headers: {}

axle:
  api_url: https://axle.axiommath.ai
  environment: null
  timeout_seconds: 900
  max_retries: 2

retry:
  backoff_seconds: 1

evaluation:
  concurrency: 8
  attempts: 4
  results_dir: results
  test_template: lean-plan-repair-v3
  max_repair_rounds: 2
  repair_feedback_role: tool
  max_truncation_retries: 1
